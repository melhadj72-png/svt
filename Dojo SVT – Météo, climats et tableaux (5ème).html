<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dojo SVT – Météo, climats et tableaux (5ème)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8ebf7; --bg2:#d5daf0; --card:#ffffff; --ink:#191a3a; --muted:#5a5d86;
  --line:#c3c8e6; --red:#d62839; --good:#12945a; --goodbg:#dff6ea; --bad:#c2273b; --badbg:#fde4e7;
  --accent:#4b4fd6; --accentink:#ffffff; --shadow:rgba(25,26,58,.18); --sun:#e8a100;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f26; --bg2:#171942; --card:#1b1d4a; --ink:#f1f2ff; --muted:#a9acd8;
    --line:#34377a; --red:#ff6475; --good:#4ee3a0; --goodbg:#0f3b2c; --bad:#ff7a8a; --badbg:#431a26;
    --accent:#8c90ff; --accentink:#0e0f26; --shadow:rgba(0,0,0,.5); --sun:#ffc94a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f26; --bg2:#171942; --card:#1b1d4a; --ink:#f1f2ff; --muted:#a9acd8;
  --line:#34377a; --red:#ff6475; --good:#4ee3a0; --goodbg:#0f3b2c; --bad:#ff7a8a; --badbg:#431a26;
  --accent:#8c90ff; --accentink:#0e0f26; --shadow:rgba(0,0,0,.5); --sun:#ffc94a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 85% -5%,var(--bg2) 0,transparent 45%),radial-gradient(circle at 0% 100%,var(--bg2) 0,transparent 40%);}
h1,h2,h3{font-family:'Lilita One','Trebuchet MS',system-ui,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.15;margin:0}
.wrap{max-width:740px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Lilita One',sans-serif;font-size:1.1rem;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand svg{width:38px;height:38px}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:800;font-size:.9rem;white-space:nowrap}
.icon{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:999px;width:42px;height:42px;font-size:1.15rem;cursor:pointer}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--shadow)}
.hero{text-align:center;padding:24px 18px 20px}
.hero svg{width:110px;height:110px}
.hero h1{font-size:2rem;margin:6px 0 8px}
.hero p{margin:6px auto;max-width:44ch;color:var(--muted);font-weight:700}
.btn{display:inline-block;background:var(--accent);color:var(--accentink);border:0;border-radius:16px;padding:13px 22px;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:8px 14px;font-size:.95rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.map{display:grid;gap:12px;margin-top:18px}
.sep{font-family:'Lilita One',sans-serif;color:var(--muted);margin:8px 2px 0;font-size:1rem}
.lv{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;color:var(--ink);border-left:12px solid var(--belt,var(--line))}
.lv[disabled]{opacity:.5;cursor:not-allowed}
.lv .em{font-size:1.7rem}
.lv b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:1.1rem;display:block}
.lv small{color:var(--muted);font-weight:700}
.lv .sc{margin-left:auto;font-weight:800;font-size:.95rem;white-space:nowrap}
.bar{height:16px;background:var(--bg2);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--belt,var(--accent));transition:width .35s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 6px;font-weight:800;color:var(--muted);font-size:.95rem}
.tag{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:999px;padding:1px 10px;font-weight:800;font-size:.85rem;margin-bottom:8px}
.q{font-size:1.2rem;font-family:'Lilita One',sans-serif;line-height:1.35;margin:2px 0 16px}
.q small{font-family:'Nunito',sans-serif;font-weight:700;color:var(--muted);font-size:.95rem}
.q b{font-weight:400;color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-size:1.02rem;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--shadow);display:flex;gap:11px;align-items:flex-start}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.good{background:var(--goodbg);border-color:var(--good)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:16px;border-radius:16px;padding:13px 15px;font-weight:700}
.fb.good{background:var(--goodbg);border:2px solid var(--good)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:1.1rem;margin-bottom:2px}
details.peek{margin-bottom:12px;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:8px 14px}
details.peek summary{cursor:pointer;font-weight:800}
.lesson h2{font-size:1.45rem;margin-bottom:10px}
.lesson h3{font-size:1.15rem;margin:16px 0 6px}
.lesson p,.lesson li{margin:6px 0}
.lesson ul,.lesson ol{padding-left:22px;margin:6px 0}
.lesson table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.97rem}
.lesson th,.lesson td{border:2px solid var(--line);padding:6px 9px;text-align:left}
.lesson th{background:var(--bg2)}
.key{background:var(--bg2);border-left:6px solid var(--red);border-radius:10px;padding:8px 12px;margin:10px 0;font-weight:700}
.model{background:var(--goodbg);border:2px solid var(--good);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.note{background:var(--bg2);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.92rem;color:var(--muted);font-weight:700}
.scroll-x{overflow-x:auto}
.big{font-family:'Lilita One',sans-serif;font-size:3.4rem;line-height:1;margin:6px 0}
.center{text-align:center}
.belt{height:22px;border-radius:6px;margin:12px auto;max-width:260px;background:var(--belt);border:3px solid var(--ink);position:relative}
.belt::after{content:"";position:absolute;left:50%;top:-6px;width:26px;height:32px;margin-left:-13px;background:var(--belt);border:3px solid var(--ink);border-radius:6px}
.ombro svg,.sunbox svg{width:100%;height:auto;max-width:440px;display:block;margin:6px auto;color:var(--ink)}
select,textarea,input[type=text]{font-family:inherit;font-size:1rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
select{font-weight:800;padding:8px 10px}
textarea{width:100%;min-height:150px;padding:10px;font-weight:600;line-height:1.5}
table.tb{border-collapse:collapse;width:100%;margin:10px 0}
table.tb td{border:2px solid var(--ink);padding:2px;min-width:78px;vertical-align:middle}
table.tb input{width:100%;border:0;background:transparent;padding:8px 6px;font-size:.95rem;font-weight:700;color:var(--ink);text-align:center;border-radius:0}
table.tb input.ok{background:var(--goodbg)}
table.tb input.ko{background:var(--badbg)}
table.tb td.corner{background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--ink) 50%,transparent calc(50% + 1.5px));padding:0;min-width:120px}
table.tb td.corner input{text-align:left;padding:4px 6px;font-size:.82rem}
table.tb td.corner input.tr{text-align:right;display:block}
table.tb td.corner input.bl{display:block;margin-top:14px}
input.title{width:100%;padding:8px 10px;font-weight:800;text-decoration:underline;text-align:center}
.crit{list-style:none;padding:0}
.crit li{padding:6px 10px;border-radius:10px;margin:5px 0;font-weight:700}
.crit li.y{background:var(--goodbg)}
.crit li.n{background:var(--badbg)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes slash{0%{opacity:0;transform:translateX(-40px) rotate(-8deg)}30%{opacity:1}100%{opacity:0;transform:translateX(60px) rotate(8deg)}}
.slash{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:'Lilita One',sans-serif;font-size:2.6rem;pointer-events:none;color:var(--red);text-shadow:0 3px 0 var(--shadow);animation:slash .9s ease-out forwards;z-index:9}
@media (prefers-reduced-motion:reduce){.pop,.slash{animation:none}.slash{opacity:1}.bar i{transition:none}}
@media (max-width:420px){.q{font-size:1.1rem}.hero h1{font-size:1.65rem}table.tb td{min-width:64px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" onclick="home()" aria-label="Retour à la carte">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="38" fill="#14142b"/><rect x="14" y="40" width="72" height="24" rx="10" fill="#f2c9a0"/><circle cx="36" cy="52" r="5" fill="#14142b"/><circle cx="64" cy="52" r="5" fill="#14142b"/><circle cx="37.6" cy="50.4" r="1.8" fill="#fff"/><circle cx="65.6" cy="50.4" r="1.8" fill="#fff"/><rect x="12" y="29" width="76" height="9" fill="#d62839"/><path d="M88 33 l11 -9 l-2 14z M88 35 l10 9 l-10 -2z" fill="#d62839"/></svg>
      <span>Dojo SVT</span>
    </button>
    <div class="chips">
      <span class="chip" id="streakChip" title="Bonnes réponses d'affilée">🔥 0</span>
      <button class="icon" id="soundBtn" aria-label="Activer ou couper le son">🔊</button>
    </div>
  </div>
  <main id="app"></main>
</div>

<script>
/* ================= OUTILS ================= */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(arr,n,not)=>shuffle(arr.filter(x=>x!==not)).slice(0,n);
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\./g,',').replace(/['’]/g,' ').replace(/[^a-z0-9,\- ]/g,' ').replace(/\s+/g,' ').trim();
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

/* ================= SON ================= */
const S={li:0,qs:[],queue:[],failed:{},lvlOk:[],lvlDone:[],lvlN:[],unlocked:0,done:0,streak:0,sound:true,answered:false,opts:[],k:0};
let AC;
function tone(f,t,d,type,v){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+.02)}catch(e){}}
const sfxGood=()=>{tone(660,0,.12,'triangle');tone(990,.09,.12,'triangle');tone(1320,.18,.3,'triangle')};
const sfxBad=()=>{tone(220,0,.2,'sawtooth',.07);tone(160,.15,.25,'sawtooth',.07)};
const sfxWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.3,'triangle',.14))};
function say(t){if(!S.sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;u.rate=1.05;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}
try{if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}}catch(e){}
function flash(txt){const d=document.createElement('div');d.className='slash';d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
$('#soundBtn').onclick=()=>{S.sound=!S.sound;$('#soundBtn').textContent=S.sound?'🔊':'🔇';if(!S.sound){try{speechSynthesis.cancel()}catch(e){}}else{say("Son activé. Prêt pour l'entraînement, jeune ninja !")}};
const setStreak=()=>{$('#streakChip').textContent='🔥 '+S.streak};
const GOOD=[
 "Bravo, jeune ninja ! Ton shuriken a fait mouche !",
 "Excellent ! Tu es rapide comme l'éclair, rien ne t'arrête !",
 "Hiya ! Bonne réponse ! Les ombres tremblent devant ton cerveau !",
 "Incroyable ! Un vrai maître ninja des sciences !",
 "Parfait ! Ton esprit est aussi tranchant qu'un katana !",
 "Silencieux et précis, comme un ninja. Bravo champion !",
 "Tu as esquivé le piège ! Le dojo est fier de toi !",
 "Combo ninja ! Tu es en feu, continue !"
];
const BAD=[
 "Pas grave, jeune ninja. Un vrai ninja apprend de chaque combat. Lis bien l'explication !",
 "Aïe, le piège était bien caché. Lis l'explication, et tu reviendras plus fort !",
 "Même les plus grands maîtres ont raté un tir. Lis l'explication, puis on recommence !"
];

/* ================= DONNÉES : VILLES (diagrammes d'entraînement) ================= */
const CITIES=[
 {name:"Nuuk (Groenland)",short:"Nuuk",T:[-8,-8,-8,-4,1,5,8,7,4,0,-4,-6],P:[45,50,55,50,50,55,60,75,80,75,65,55],cl:"polaire"},
 {name:"Paris (France)",short:"Paris",T:[5,6,9,12,15,19,21,21,17,13,8,6],P:[51,41,47,50,65,62,60,58,50,56,56,59],cl:"tempéré"},
 {name:"Le Caire (Égypte)",short:"Le Caire",T:[14,16,18,22,26,28,29,29,27,24,20,16],P:[5,4,4,1,0,0,0,0,0,1,4,5],cl:"chaud"}
];
const stat=c=>({Tx:Math.max(...c.T),Tn:Math.min(...c.T),Px:Math.max(...c.P),Pn:Math.min(...c.P)});
function ombro(c){
  const W=400,H=262,l=44,r=44,t=30,b=30,pw=W-l-r,ph=H-t-b,Tn=-10,Tx=30;
  const y=T=>t+ph*(1-(T-Tn)/(Tx-Tn));
  const yP=P=>y(0)-(P/3)*(ph/(Tx-Tn));
  let g=`<text x="${W/2}" y="14" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">${c.name}</text><text x="${l-6}" y="${t-8}" text-anchor="end" font-size="10" fill="#d62839" font-weight="800">°C</text><text x="${W-r+6}" y="${t-8}" font-size="10" fill="#3b8be8" font-weight="800">mm</text>`;
  for(let T=Tn;T<=Tx;T+=5){g+=`<line x1="${l}" x2="${W-r}" y1="${y(T)}" y2="${y(T)}" stroke="currentColor" stroke-opacity="${T===0?.75:.14}" stroke-width="${T===0?1.6:1}"/><text x="${l-6}" y="${y(T)+4}" text-anchor="end" font-size="10" fill="#d62839">${T}</text>`}
  for(let P=0;P<=90;P+=15){g+=`<text x="${W-r+6}" y="${yP(P)+4}" font-size="10" fill="#3b8be8">${P}</text>`}
  const bw=pw/12;
  c.P.forEach((p,i)=>{g+=`<rect x="${l+i*bw+bw*.2}" y="${yP(p)}" width="${bw*.6}" height="${Math.max(y(0)-yP(p),0)}" fill="#3b8be8" fill-opacity=".72"/>`;g+=`<text x="${l+i*bw+bw/2}" y="${H-b+16}" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${'JFMAMJJASOND'[i]}</text>`});
  const pts=c.T.map((v,i)=>`${l+i*bw+bw/2},${y(v)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="#d62839" stroke-width="2.6"/>`;
  c.T.forEach((v,i)=>{g+=`<circle cx="${l+i*bw+bw/2}" cy="${y(v)}" r="3.2" fill="#d62839"/>`});
  return `<div class="ombro"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagramme ombrothermique de ${c.name}">${g}</svg></div>`;
}
const monthsOf=(arr,v)=>arr.map((x,i)=>x===v?MONTHS[i]:null).filter(Boolean).join(' et ');

/* ================= NIVEAUX ================= */
const LEVELS=[
/* 0 */ {name:"Ceinture blanche",em:"🌦️",belt:"#f3f3f3",title:"Météo ou climat ?",
 lesson:()=>`<h2>📜 Parchemin 1 : météo ou climat ?</h2>
 <div class="scroll-x"><table><tr><th></th><th>🌦️ MÉTÉO</th><th>📅 CLIMAT</th></tr>
 <tr><td><b>C'est…</b></td><td>le temps qu'il fait <b>aujourd'hui</b> et pendant les <b>jours à venir</b></td><td><b>la moyenne</b> des conditions météo sur <b>plusieurs décennies</b></td></tr>
 <tr><td><b>Durée</b></td><td>quelques heures, quelques jours</td><td>des dizaines d'années</td></tr>
 <tr><td><b>Exemples</b></td><td>un orage ce soir, une canicule le 15 juillet, des inondations en quelques heures</td><td>les étés sont chauds et secs en Provence, il pleut très peu au Sahara</td></tr></table></div>
 <div class="key">📏 Une <b>décennie</b> = <b>10 ans</b>. Plusieurs décennies = plusieurs dizaines d'années.</div>
 <div class="key">🥷 Le truc : <b>un événement précis (ce jour-là, en quelques heures)</b> = météo. <b>En moyenne, depuis des décennies</b> = climat.</div>
 <h3>Modèle de réponse (question à 2 points)</h3>
 <p><i>À l'aide de l'introduction et du document 1, indiquer si l'épisode du 21 septembre 2025 relève de la météo ou du climat. Justifier.</i></p>
 <div class="model">L'épisode du 21 septembre 2025 relève de la <b>météo</b>. En effet, d'après l'introduction, les inondations se sont produites <b>en quelques heures</b>, un jour précis (le dimanche 21 septembre 2025). Or, d'après le document 1, la météo correspond au <b>temps qu'il fait aujourd'hui et pendant les jours à venir</b>, alors que le climat est la <b>moyenne</b> des conditions météo sur <b>plusieurs décennies</b>.</div>
 <p>Structure : <b>1) Je réponds</b> (météo) ➜ <b>2) Je justifie avec l'introduction</b> ➜ <b>3) Je justifie avec le document</b>.</p>
 <div class="note">Attention : l'introduction dit aussi que les pluies sont « de plus en plus importantes chaque automne » et « de plus en plus fréquentes ». Cette <b>évolution sur de nombreuses années</b> concerne le <b>climat</b>, mais l'épisode précis du 21 septembre, lui, est un événement de <b>météo</b>.</div>`,
 build:()=>[
  ["Que désigne la météo ?","Le temps qu'il fait aujourd'hui et pendant les jours à venir",["La moyenne des conditions météo sur plusieurs décennies","Le temps qu'il faisait il y a 100 ans","Les saisons de l'année"],"Définition de Météo-France : la météo, c'est le temps qu'il fait aujourd'hui et pendant les jours à venir."],
  ["Que désigne le climat ?","La moyenne des conditions météo sur plusieurs décennies",["Le temps qu'il fait aujourd'hui","La prévision du lendemain","Un orage violent"],"Le climat est la moyenne des conditions météo sur plusieurs décennies."],
  ["Une décennie correspond à…","10 ans",["1 an","100 ans","50 ans"],"Déca = dix : une décennie = 10 ans (comme le précise le sujet)."],
  ["« Plusieurs décennies » représente…","Plusieurs dizaines d'années",["Quelques jours","Quelques mois","Une seule année"],"Plusieurs décennies = 20, 30, 40 ans ou plus. C'est la durée nécessaire pour parler de climat."],
  ["« Il pleut ce matin à Paris » : météo ou climat ?","Météo",["Climat","Les deux en même temps","Ni l'un ni l'autre"],"C'est le temps qu'il fait aujourd'hui : météo."],

/* 4 */ {name:"Ceinture bleue",em:"📈",belt:"#2f80ed",title:"Lire un diagramme ombrothermique",
 lesson:()=>`<h2>📜 Parchemin 5 : lire un diagramme ombrothermique</h2>
 <ul><li>Axe horizontal : les <b>12 mois</b> (J F M A M J J A S O N D).</li>
 <li>La <b>courbe rouge</b> = <b>températures moyennes</b> de chaque mois. Axe de <b>gauche</b> en <b>°C</b>.</li>
 <li>Les <b>barres bleues</b> = <b>précipitations</b> de chaque mois. Axe de <b>droite</b> en <b>mm</b>.</li></ul>
 <div class="scroll-x"><table><tr><th>Je cherche…</th><th>Je lis…</th></tr>
 <tr><td>Température moyenne <b>maximale</b></td><td>le point le <b>plus haut</b> de la courbe</td></tr>
 <tr><td>Température moyenne <b>minimale</b></td><td>le point le <b>plus bas</b> de la courbe</td></tr>
 <tr><td>Précipitations <b>maximales</b></td><td>la barre la <b>plus haute</b></td></tr>
 <tr><td>Précipitations <b>minimales</b></td><td>la barre la <b>plus basse</b></td></tr></table></div>
 <div class="key">👀 Pense à regarder la <b>bonne échelle</b> : °C à gauche (courbe), mm à droite (barres).</div>
 <h3>🧪 Entraîne-toi sur 3 villes</h3>
 <div id="ombrotool"></div>
 <div class="note">Ces diagrammes sont des <b>diagrammes d'entraînement</b> (valeurs arrondies) : sur ta fiche, tu auras tes propres villes, mais la méthode est exactement la même.</div>`,
 init:()=>initOmbro(),
 build:()=>{
  const out=[];
  const optT=v=>pickN([v-9,v-6,v-3,v+3,v+6,v+9],3).map(n=>n+' °C');
  const optP=v=>pickN([v-20,v-10,v+10,v+20,v+30].filter(n=>n>=0),3).map(n=>n+' mm');
  CITIES.forEach(c=>{
    const s=stat(c),svg=ombro(c);
    out.push([`${svg}Quelle est la <b>température moyenne maximale</b> de ${c.short} ?`,s.Tx+' °C',optT(s.Tx),`Point le plus haut de la courbe rouge : ${s.Tx} °C (${monthsOf(c.T,s.Tx)}).`]);
    out.push([`${svg}Quelle est la <b>température moyenne minimale</b> de ${c.short} ?`,s.Tn+' °C',optT(s.Tn),`Point le plus bas de la courbe rouge : ${s.Tn} °C (${monthsOf(c.T,s.Tn)}).`]);
    out.push([`${svg}Quelles sont les <b>précipitations maximales</b> de ${c.short} ?`,s.Px+' mm',optP(s.Px),`Barre la plus haute : ${s.Px} mm (${monthsOf(c.P,s.Px)}). On lit l'axe de droite (mm).`]);
    const def={polaire:"froid toute l'année, 10 °C au maximum, hivers glacials",tempéré:"hivers doux et étés chauds",chaud:"étés très chauds et hivers chauds"}[c.cl];
    out.push([`${svg}Quel est le <b>climat</b> de ${c.short} ?`,"Climat "+c.cl,["Climat polaire","Climat tempéré","Climat chaud"].filter(x=>x!=="Climat "+c.cl),`${c.short} : température maximale ${s.Tx} °C, minimale ${s.Tn} °C : ${def}. C'est un climat ${c.cl}.`]);
  });
  const p=CITIES[1],cc=CITIES[2],sc=stat(cc);
  out.push(["À Paris, quel(s) mois est (sont) le(s) plus chaud(s) ?","Juillet et août",["Janvier et février","Avril et mai","Novembre et décembre"],"La courbe atteint 21 °C en juillet et en août : ce sont les mois les plus chauds."]);
  out.push([`${ombro(cc)}Quelles sont les <b>précipitations minimales</b> au Caire ?`,"0 mm (pas de pluie de mai à septembre)",["5 mm toute l'année","15 mm","30 mm"],`Aucune barre de mai à septembre : ${sc.Pn} mm. Le Caire est très sec.`]);
  return out;
 }},
/* 5 */ {name:"Ceinture marron",em:"🧮",belt:"#a0643c",title:"Construire un tableau : la théorie",
 lesson:()=>`<h2>📜 Parchemin 6 : construire un tableau</h2>
 <p>Un tableau <b>organise plusieurs informations</b> sur un même document pour les rendre <b>plus lisibles et comparables</b>.</p>
 <div class="scroll-x"><table><tr><th></th><th>Tableau simple (à une entrée)</th><th>Tableau à double entrée</th></tr>
 <tr><td><b>Objectif</b></td><td>Présenter des données selon <b>un seul critère</b></td><td>Comparer des données selon <b>deux critères</b></td></tr>
 <tr><td><b>Exemple</b></td><td>Taille d'une plantule en fonction du temps</td><td>Êtres vivants en fonction de leur environnement</td></tr></table></div>
 <h3>Les étapes (double entrée)</h3>
 <ol><li><b>Au brouillon</b> : compter les éléments à comparer ➜ <b>colonnes</b> (+ 1 colonne pour les titres des lignes). Compter les caractéristiques ➜ <b>lignes</b> (+ 1 ligne pour les titres des colonnes).</li>
 <li><b>Au propre</b> : tracer le tableau <b>à la règle</b>.</li>
 <li>Construire la <b>case double entrée</b> (en haut à gauche) avec le <b>titre général des lignes</b> et celui des <b>colonnes</b>.</li>
 <li>Compléter les <b>titres des lignes et des colonnes</b> (<b>unités entre parenthèses</b>), puis <b>toutes les cases</b>.</li>
 <li>Ajouter un <b>titre souligné</b> <b>sous le tableau</b> : « Tableau présentant… » (en <b>majuscules</b> pour l'activité 3).</li></ol>
 <div class="key">Exemple du cours : 2 rapaces à comparer (buse variable, milan noir) ➜ <b>3 colonnes</b> (2 + 1). 2 caractéristiques (queue, dessous des ailes) ➜ <b>3 lignes</b> (2 + 1).</div>
 <h3>Critères de réussite</h3>

 <p>👉 Va t'entraîner dans l'<b>Atelier tableaux</b> (sur la carte) pour construire de vrais tableaux !</p>`,

const CORE=[0,1,2,3,4,5,6];
LEVELS.forEach((_,i)=>{S.lvlOk[i]=0;S.lvlDone[i]=false;S.lvlN[i]=0});
function totals(){let ok=0,n=0;CORE.forEach(i=>{if(S.lvlDone[i]){ok+=S.lvlOk[i];n+=S.lvlN[i]}});return {ok,n}}
const grade=()=>{const t=totals();return t.n?t.ok/t.n*20:0};

/* ================= WIDGETS ================= */
function initSun(){
  const el=$('#sun');if(!el)return;
  el.innerHTML=`<label>Latitude : <b id="latv">0</b>° <small id="latn">(équateur)</small><input type="range" id="lat" min="0" max="75" value="0" step="1" style="width:100%" aria-label="Latitude"></label>
  <svg id="sunsvg" viewBox="0 0 400 260" role="img" aria-label="Faisceau de rayons du Soleil sur la Terre"></svg><div id="sunout" class="key"></div>`;
  $('#lat').oninput=drawSun;drawSun();
}
function drawSun(){
  const deg=+$('#lat').value,phi=deg*Math.PI/180,cx=270,cy=130,r=100,w=26;
  const yP=cy-r*Math.sin(phi),y1=yP-w/2,y2=yP+w/2;
  const xs=y=>cx-Math.sqrt(Math.max(r*r-(y-cy)*(y-cy),0));
  const x1=xs(y1),x2=xs(y2),ym=(y1+y2)/2,xm=xs(ym);
  const L=Math.hypot(x2-x1,y2-y1);
  let g=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#3b8be8" fill-opacity=".35" stroke="currentColor" stroke-width="2"/>
  <line x1="${cx-r}" x2="${cx+r}" y1="${cy}" y2="${cy}" stroke="currentColor" stroke-dasharray="5 4" stroke-opacity=".6"/>
  <text x="${cx+r+4}" y="${cy+4}" font-size="11" fill="currentColor" font-weight="700">Équateur</text>
  <text x="${cx}" y="${cy-r-6}" text-anchor="middle" font-size="11" fill="currentColor" font-weight="700">Pôle Nord</text>
  <circle cx="45" cy="130" r="22" fill="#ffc94a"/><text x="45" y="168" text-anchor="middle" font-size="11" fill="currentColor" font-weight="700">Soleil</text>
  <polygon points="70,${y1} ${x1},${y1} ${x2},${y2} 70,${y2}" fill="#ffc94a" fill-opacity=".35"/>
  <line x1="70" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#e8a100" stroke-width="2"/>
  <line x1="70" y1="${ym}" x2="${xm}" y2="${ym}" stroke="#e8a100" stroke-width="2"/>
  <line x1="70" y1="${y2}" x2="${x2}" y2="${y2}" stroke="#e8a100" stroke-width="2"/>
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d62839" stroke-width="6" stroke-linecap="round"/>`;
  $('#sunsvg').innerHTML=g;
  const c=Math.cos(phi),ang=90-deg;
  $('#latv').textContent=deg;$('#latn').textContent=deg===0?'(équateur)':deg>=66?'(cercle polaire ou au-delà)':'';
  $('#sunout').innerHTML=`Angle des rayons avec la surface : <b>${ang}°</b> ${ang>=85?'(perpendiculaires)':ang<=25?'(très inclinés)':'(inclinés)'}<br>Surface éclairée par le faisceau (trait rouge) : <b>×${(1/c).toFixed(1)}</b> par rapport à l'équateur (longueur ${Math.round(L)} contre ${w}).<br>Énergie reçue par m² : <b>${Math.round(c*100)} %</b> de celle de l'équateur.`;
}

/* ========== QCM ========== */
function startLevel(i){
  S.li=i;const L=LEVELS[i];
  S.qs=L.build();
  S.queue=S.qs.map((_,k)=>k);S.failed={};S.lvlOk[i]=0;S.lvlDone[i]=false;S.lvlN[i]=S.qs.length;S.done=0;
  app.innerHTML=`<section class="card lesson pop" style="border-top:12px solid ${L.belt}">${L.lesson()}
  <div class="btns"><button class="btn ghost" onclick="home()">⬅ Carte</button><button class="btn" onclick="showQ()">J'ai compris : au combat ! ⚔️</button></div></section>`;
  if(L.init)L.init();
  window.scrollTo(0,0);
  say(i===0?"Bienvenue au dojo, jeune ninja ! Lis bien le parchemin, puis c'est parti !":"Nouveau parchemin, nouvelle ceinture ! Lis bien, puis au combat !");
}

function showQ(){
  const L=LEVELS[S.li];
  if(!S.queue.length)return levelEnd();
  const k=S.queue[0],q=S.qs[k];
  S.k=k;S.answered=false;
  const wr=[...new Set(q[2].filter(x=>x!==q[1]))];
  S.opts=shuffle([{t:q[1],c:1}].concat(wr.map(t=>({t,c:0}))));
  const N=S.qs.length,pct=Math.round(S.done/N*100);
  const letters=['A','B','C','D'];
  app.innerHTML=`<section class="pop">
   <details class="peek"><summary>📜 Revoir le parchemin</summary><div class="lesson">${L.lesson()}</div></details>
   <div class="qhead"><span>${L.em} ${L.name}</span><span>${S.done} / ${N} réussies</span></div>
   <div class="bar" style="--belt:${L.belt==='#f3f3f3'?'#9aa3d8':L.belt==='#1a1a2e'?'#d62839':L.belt}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   <div class="card" style="margin-top:14px">
     ${S.failed[k]?'<span class="tag">🔁 Rattrapage : tu vas y arriver !</span>':''}
     <p class="q">${q[0]}</p>
     <div class="opts">${S.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="k">${letters[i]}</span><span>${o.t}</span></button>`).join('')}</div>
     <div id="fb"></div>
   </div></section>`;
  if(L.init)L.init();
  window.scrollTo(0,0);
}

function pick(i){
  if(S.answered)return;S.answered=true;
  const k=S.k,q=S.qs[k],o=S.opts[i];
  const btns=[...document.querySelectorAll('.opt')];btns.forEach(b=>b.disabled=true);
  let fb;
  if(o.c){
    btns[i].classList.add('good');
    S.queue.shift();S.done++;
    if(!S.failed[k])S.lvlOk[S.li]++;
    S.streak++;setStreak();
    sfxGood();flash(S.streak>=3?'🔥 COMBO x'+S.streak+' !':'⚔️ Touché !');
    let msg=GOOD[Math.floor(Math.random()*GOOD.length)];
    if(S.streak===3)msg="Trois d'affilée ! Tu es en mode ninja rapide !";
    else if(S.streak===5)msg="Cinq d'affilée ! Les ombres n'ont aucune chance contre toi !";
    else if(S.streak===10)msg="Dix d'affilée ! Tu deviens un ninja légendaire !";
    else if(S.streak===20)msg="Vingt d'affilée ! Maître ninja des sciences, tu es imbattable !";
    setTimeout(()=>say(msg),250);
    fb=`<div class="fb good"><b>✅ Bonne réponse !</b>${q[3]}</div>`;
  }else{
    btns[i].classList.add('bad');
    S.failed[k]=1;S.queue.shift();S.queue.push(k);
    S.streak=0;setStreak();
    sfxBad();
    setTimeout(()=>say(BAD[Math.floor(Math.random()*BAD.length)]),250);
    fb=`<div class="fb bad"><b>❌ Pas tout à fait…</b>${q[3]}<br><em>Cette question reviendra à la fin de la ceinture pour que tu la maîtrises.</em></div>`;
  }
  $('#fb').innerHTML=fb+`<div class="btns"><button class="btn" onclick="showQ()" id="nextBtn">Suivant ➜</button></div>`;
  $('#nextBtn').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function levelEnd(){
  const L=LEVELS[S.li],N=S.qs.length,ok=S.lvlOk[S.li];
  S.lvlDone[S.li]=true;
  if(!L.bonus)S.unlocked=Math.max(S.unlocked,Math.min(S.li+1,6));
  const last=CORE.every(i=>S.lvlDone[i]);
  const perfect=ok===N;
  sfxWin();
  say(perfect?"Sans aucune erreur ! Tu es un ninja exceptionnel !":"Terminé ! Tu as maîtrisé toutes les questions. Bravo jeune ninja !");
  const next=(!L.bonus&&S.li<6)?`<button class="btn" onclick="startLevel(${S.li+1})">Ceinture suivante ➜</button>`:(last?`<button class="btn" onclick="finalScreen()">Voir ma note finale 🏁</button>`:'');
  app.innerHTML=`<section class="card center pop" style="--belt:${L.belt}">
   <div style="font-size:3rem">${perfect?'🏆':'🥷'}</div>
   <h2>${L.bonus?'Mission accomplie !':L.name+' obtenue !'}</h2><div class="belt"></div>

  window.scrollTo(0,0);
}

/* ========== ATELIER TABLEAUX ========== */
const cl=(all,none,o)=>Object.assign({all:all||[],none:none||[]},o||{});
function climRows(){
  const rows=[['temperature','maxim'],['temperature','minim'],['precipitation','maxim'],['precipitation','minim']];
  const m=CITIES.map(c=>{const s=stat(c);return [s.Tx,s.Tn,s.Px,s.Pn]});
  const exp=[[null].concat(CITIES.map(c=>cl([norm(c.short.replace('Le ',''))])))];
  rows.forEach((r,ri)=>exp.push([cl(r,[],{unit:true})].concat(m.map(v=>cl([String(v[ri])],[],{eq:true})))));
  const model=[['Villes / Données'].concat(CITIES.map(c=>c.short)),
   ['Température moyenne maximale (en °C)'].concat(m.map(v=>v[0])),
   ['Température moyenne minimale (en °C)'].concat(m.map(v=>v[1])),
   ['Précipitations moyennes maximales (en mm)'].concat(m.map(v=>v[2])),
   ['Précipitations moyennes minimales (en mm)'].concat(m.map(v=>v[3]))];
  return {exp,model};
}
function buildEX(){
  const cr=climRows();
  return [

let EXS=null,CUR=null;
function atelier(){
  EXS=EXS||buildEX();
  app.innerHTML=`<section class="card lesson pop"><h2>🧮 Atelier tableaux</h2>
  <p>Choisis un exercice, construis le tableau ici, puis clique sur <b>Vérifier</b>. Ensuite, <b>refais-le sur ta feuille, à la règle</b> : c'est ça qui sera évalué !</p>
  <div class="map">${EXS.map((e,i)=>`<button class="lv" style="--belt:#a0643c" onclick="openEx(${i})"><span class="em">${['🦅','🌱','🌳','🌡️'][i]}</span><span><b>${e.name}</b><small>${e.type}</small></span></button>`).join('')}</div>
  <div class="btns"><button class="btn ghost" onclick="home()">⬅ Carte</button></div></section>`;
  window.scrollTo(0,0);
}
function openEx(i){
  const e=EXS[i];CUR=e;
  let t='<table class="tb">';
  for(let r=0;r<e.rows;r++){t+='<tr>';for(let c=0;c<e.cols;c++){
    if(r===0&&c===0&&e.corner)t+=`<td class="corner"><input class="tr" id="g_tr" placeholder="titre des colonnes" aria-label="Titre général des colonnes"><input class="bl" id="g_bl" placeholder="titre des lignes" aria-label="Titre général des lignes"></td>`;
    else t+=`<td><input id="g_${r}_${c}" autocomplete="off" aria-label="Case ligne ${r+1} colonne ${c+1}"></td>`;
  }t+='</tr>'}
  t+='</table>';
  app.innerHTML=`<section class="card lesson pop"><h2>🧮 ${e.name}</h2><p><span class="note" style="display:inline-block;margin:0">${e.type}</span></p>
  <p>${e.text}</p>${e.diagrams?`<div class="scroll-x">${CITIES.map(ombro).join('')}</div>`:''}
  <div class="note">💡 ${e.hint}</div>
  ${t}
  <label><small>Titre du tableau (sous le tableau, souligné)</small><input type="text" class="title" id="g_title" aria-label="Titre du tableau" placeholder="Tableau présentant…"></label>
  <label style="display:block;margin-top:10px"><input type="checkbox" id="g_rule"> J'ai refait ce tableau sur ma feuille <b>à la règle</b></label>
  <div id="res"></div>
  <div class="btns"><button class="btn ghost" onclick="atelier()">⬅ Exercices</button><button class="btn" onclick="checkEx()">✅ Vérifier</button></div></section>`;
  window.scrollTo(0,0);
}
function cellOk(spec,v){
  const n=norm(v),raw=(v||'').toLowerCase();
  if(!n)return false;
  if(spec.eq)return n===spec.all[0];
  if(!spec.all.every(t=>n.includes(t)))return false;
  if(spec.none.some(t=>n.includes(t)))return false;
  if(spec.unit&&!(raw.includes('(')&&raw.includes(')')))return false;
  return true;
}
function checkEx(){
  const e=CUR;let head=0,headOk=0,info=0,infoOk=0,unit=0,unitOk=0;const bad=[];
  for(let r=0;r<e.rows;r++)for(let c=0;c<e.cols;c++){
    const spec=e.exp[r][c];if(!spec)continue;
    const el=$(`#g_${r}_${c}`),ok=cellOk(spec,el.value);
    el.classList.remove('ok','ko');el.classList.add(ok?'ok':'ko');
    const isHead=(r===0||c===0);
    if(isHead){head++;if(ok)headOk++}else{info++;if(ok)infoOk++}
    if(spec.unit){unit++;if(ok)unitOk++}
    if(!ok)bad.push(`ligne ${r+1}, colonne ${c+1} ➜ <b>${e.model[r][c]}</b>`);
  }
  if(e.corner){
    const tr=$('#g_tr'),bl=$('#g_bl');
    const okTr=e.corner.tr.every(t=>norm(tr.value).includes(t))&&norm(tr.value)!=='';
    const okBl=e.corner.bl.every(t=>norm(bl.value).includes(t))&&norm(bl.value)!=='';
    tr.classList.remove('ok','ko');bl.classList.remove('ok','ko');tr.classList.add(okTr?'ok':'ko');bl.classList.add(okBl?'ok':'ko');
    head+=2;headOk+=(okTr?1:0)+(okBl?1:0);
    if(!okTr||!okBl)bad.push(`case double entrée ➜ <b>${e.model[0][0]}</b>`);
  }
  const tv=$('#g_title').value,tn=norm(tv);
  const titleOk=e.title.all.every(t=>tn.includes(t))&&(!e.title.upper||(tv===tv.toUpperCase()&&tv.length>8));
  const ruleOk=$('#g_rule').checked;
  const items=[
   [ruleOk,"Construction : j'ai tracé les lignes et colonnes à la règle sur ma feuille"],
   [headOk===head,`Conception : en-têtes précis et complets (${headOk}/${head})`],
   [unit===0||unitOk===unit,"Conception : unités entre parenthèses"+(unit?` (${unitOk}/${unit})`:'')],
   [titleOk,"Conception : titre « Tableau présentant… »"+(e.title.upper?" en MAJUSCULES":"")+", sous le tableau, souligné"],
   [infoOk===info,`Informations : cases complétées correctement (${infoOk}/${info})`]
  ];
  const score=items.filter(x=>x[0]).length;
  const face=score===5?'🟢 Tableau réussi !':score>=3?'🟡 Presque !':'🔴 À retravailler';
  $('#res').innerHTML=`<h3>${face}</h3><ul class="crit">${items.map(x=>`<li class="${x[0]?'y':'n'}">${x[0]?'✅':'❌'} ${x[1]}</li>`).join('')}</ul>
  ${bad.length?`<div class="note"><b>À corriger :</b><br>${bad.slice(0,8).join('<br>')}${bad.length>8?'<br>…':''}</div>`:''}
  ${titleOk?'':`<div class="note">Titre attendu, par exemple : <b>${e.titleModel}</b></div>`}
  <div class="btns"><button class="btn ghost sm" onclick="showModel()">👁️ Voir le tableau modèle</button></div><div id="mod"></div>`;
  if(score===5){sfxWin();say("Tableau parfait ! Maintenant, refais-le à la règle sur ta feuille. Bravo, jeune ninja !")}
  else{sfxBad();say("Presque, jeune ninja ! Regarde ce qu'il faut corriger, puis réessaie.")}
  $('#res').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function showModel(){
  const e=CUR;
  $('#mod').innerHTML=`<table class="tb">${e.model.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td style="text-align:center;padding:6px;font-weight:${(ri===0||ci===0)?800:600}">${c}</td>`).join('')}</tr>`).join('')}</table><p style="text-align:center"><u>${e.titleModel}</u></p>`;
}
